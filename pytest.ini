[pytest]
pythonpath = .
asyncio_mode = auto
; Fixtures e testes async compartilham UM event loop de sessao: misturar loops
; deixa conexoes asyncpg presas em um loop e awaits em outro (deadlock)
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:pydantic
